global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: "noant-app"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: noant-app
    scrape_interval: 15s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter
    scrape_interval: 30s
