    post:
      tags: [Training]
      summary: Train unknown question (create QA pair from it)
      operationId: trainUnknown
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UnknownQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, category_id]
              properties:
                answer:
                  type: string
                category_id:
                  type: string
      responses:
        "200":
          description: Question trained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Unknown question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/training/unknown-questions/{id}/ignore:
    post:
      tags: [Training]
      summary: Ignore unknown question
      operationId: ignoreUnknown
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UnknownQuestionId"
      responses:
        "200":
          description: Ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/training/unknown-questions/batch-train:
    post:
      tags: [Training]
      summary: Batch train unknown questions
      operationId: batchTrainUnknown
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, answer, category_id]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                answer:
                  type: string
                category_id:
                  type: string
      responses:
        "200":
          description: Batch trained
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer

  /api/v1/training/unknown-questions/batch-ignore:
    post:
      tags: [Training]
      summary: Batch ignore unknown questions
      operationId: batchIgnoreUnknown
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Batch ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer

  /api/v1/training/unknown-questions/clear:
    delete:
      tags: [Training]
      summary: Clear all unknown questions
      operationId: clearUnknown
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/training/csv-upload:
    post:
      tags: [Training]
      summary: Upload CSV of QA pairs
      description: |
        Multipart form upload. Max 2 MB, `.csv` extension required.
        Binary/compressed content is rejected.
      operationId: uploadCSV
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file (question,answer columns)
                category_id:
                  type: string
                  description: Target category (defaults to "default")
      responses:
        "200":
          description: CSV uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

