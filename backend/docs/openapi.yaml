  #  DB MANAGER (Admin)
  # ══════════════════════════════════════════════════════════
  /api/v1/db-manager/tasks:
    get:
      tags: [DB Manager]
      summary: List available cleanup tasks
      operationId: listCleanupTasks
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string

  /api/v1/db-manager/config:
    get:
      tags: [DB Manager]
      summary: Get cleanup configuration
      operationId: getCleanupConfig
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    description: Default cleanup day-thresholds for each task

  /api/v1/db-manager/run-all:
    post:
      tags: [DB Manager]
      summary: Run all cleanup tasks
      operationId: runAllCleanups
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Cleanup report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    $ref: "#/components/schemas/CleanupReport"

  /api/v1/db-manager/run:
    post:
      tags: [DB Manager]
      summary: Run a single cleanup task
      operationId: runCleanupTask
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_name]
              properties:
                task_name:
                  type: string
                  description: |
                    One of: `old_resolved_conversations`, `abandoned_conversations`,
                    `orphaned_messages`, `stale_unknown_questions`, `expired_handoffs`,
                    `old_audit_logs`, `old_notifications`, `stale_inactive_integrations`,
                    `expired_trials`, `expired_credits`, `stale_credit_purchases`,
                    `completed_campaigns`
                days:
                  type: integer
                  description: Override default retention period (days)
      responses:
        "200":
          description: Task result
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    type: object
                    properties:
                      name:
                        type: string
                      status:
                        type: string
                      deleted:
                        type: integer

  # ══════════════════════════════════════════════════════════
  #  BACKGROUND WORKER (Admin)
  # ══════════════════════════════════════════════════════════
  /api/v1/background/submit:
    post:
      tags: [Background Worker]
      summary: Submit background task
      operationId: submitBackgroundTask
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_name]
              properties:
                task_name:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "202":
          description: Task submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    example: submitted

  /api/v1/background/tasks:
    get:
      tags: [Background Worker]
      summary: List background tasks
      operationId: listBackgroundTasks
      security:
        - CookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Tasks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackgroundTask"
                  count:
                    type: integer

  /api/v1/background/tasks/{id}:
    get:
      tags: [Background Worker]
      summary: Get task status
      operationId: getBackgroundTaskStatus
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BackgroundTaskId"
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/BackgroundTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/background/stats:
    get:
      tags: [Background Worker]
      summary: Worker pool statistics
      operationId: workerStats
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    type: object

  # ══════════════════════════════════════════════════════════
  #  ASSISTANT
  # ══════════════════════════════════════════════════════════
  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: Chat with onboarding assistant
      operationId: assistantChat
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "How do I set up my first FAQ category?"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"

  # ══════════════════════════════════════════════════════════
  #  ONBOARDING
  # ══════════════════════════════════════════════════════════
  /api/v1/onboarding/status:
    get:
      tags: [Onboarding]
      summary: Get onboarding status
      operationId: getOnboardingStatus
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /api/v1/onboarding/step:
    post:
      tags: [Onboarding]
      summary: Complete onboarding step
      operationId: completeOnboardingStep
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step]
              properties:
                step:
                  type: string
                  description: Step identifier (e.g. "profile", "industry", "categories", "integration")
                industry:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Step completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  step:
                    type: string

  /api/v1/onboarding/categories/auto-create:
    post:
      tags: [Onboarding]
      summary: Auto-create categories from industry template
      operationId: autoCreateCategories
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [industry_id]
              properties:
                industry_id:
                  type: string
      responses:
        "201":
          description: Categories created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                  count:
                    type: integer

  /api/v1/onboarding/industry-templates:
    get:
      tags: [Onboarding]
      summary: List industry templates
      operationId: getIndustryTemplates
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Industry templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  industries:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndustryTemplate"

  # ══════════════════════════════════════════════════════════
  #  PUSH NOTIFICATIONS
  # ══════════════════════════════════════════════════════════
  /api/v1/push/subscribe:
    post:
      tags: [Push Notifications]
      summary: Subscribe to push notifications
      operationId: pushSubscribe
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/push/unsubscribe:
    post:
      tags: [Push Notifications]
      summary: Unsubscribe from push notifications
      operationId: pushUnsubscribe
      security:
        - CookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  format: uri
                  description: If omitted, all subscriptions for the user are removed
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
