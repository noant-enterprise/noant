  # ══════════════════════════════════════════════════════════
  #  WHATSAPP (OpenWA) — Session & Webhook
  # ══════════════════════════════════════════════════════════
  /api/v1/openwa/webhook:
    post:
      tags: [WhatsApp]
      summary: WhatsApp webhook receiver
      description: |
        No JWT auth. Verified by HMAC signature (`X-Hub-Signature-256`).
        Rate-limited to 1000 req/min.
      operationId: whatsappWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: OpenWA webhook event payload
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Invalid or missing signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/openwa/status:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp session status
      operationId: getOpenWAStatus
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  session_id:
                    type: string

  /api/v1/openwa/restart:
    post:
      tags: [WhatsApp]
      summary: Restart WhatsApp session
      operationId: restartOpenWA
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Restart initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session_id:
                    type: string

  # ── WhatsApp Channel Endpoints ────────────────────────────
  /api/v1/channels/whatsapp/connect:
    post:
      tags: [WhatsApp]
      summary: Connect WhatsApp (create session + QR code)
      description: |
        Creates an OpenWA session, starts it, and returns session info.
        QR code is obtained via long-polling `GET /channels/whatsapp/status/{sessionId}`.
      operationId: connectWhatsApp
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+2348012345678"
      responses:
        "200":
          description: Session initializing
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                  qr_code:
                    type: string
                    description: Empty initially; poll status endpoint for QR
                  phone:
                    type: string
                  status:
                    type: string
                    example: initializing

  /api/v1/channels/whatsapp/status/{sessionId}:
    get:
      tags: [WhatsApp]
      summary: Get WhatsApp status (long-poll)
      description: |
        Long-polls for up to 25 seconds waiting for status/QR changes.
        Use `?force=true` to force-mark as connected, `?poll=false` to disable long-polling.
      operationId: getWhatsAppStatus
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: force
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: poll
          in: query
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
      responses:
        "200":
          description: Session status with optional QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  qr_code:
                    type: string
                  session:
                    type: string
                  connected:
                    type: boolean

  /api/v1/channels/whatsapp/refresh/{sessionId}:
    post:
      tags: [WhatsApp]
      summary: Refresh QR code
      description: Deletes the old session and creates a fresh one to generate a new QR code.
      operationId: refreshWhatsAppQR
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: New session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                  session_id:
                    type: string

  /api/v1/channels/whatsapp/disconnect:
    post:
      tags: [WhatsApp]
      summary: Disconnect WhatsApp session
      operationId: disconnectWhatsApp
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/v1/channels/whatsapp/ping:
    post:
      tags: [WhatsApp]
      summary: Send test message to verify connection
      operationId: phonePing
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+2348012345678"
      responses:
        "200":
          description: Test message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Phone number not on WhatsApp
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/channels/whatsapp/check:
    post:
      tags: [WhatsApp]
      summary: Check if phone number exists on WhatsApp
      operationId: checkWhatsAppNumber
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone:
                    type: string
                  exists:
                    type: boolean

  /api/v1/channels/whatsapp/health:
