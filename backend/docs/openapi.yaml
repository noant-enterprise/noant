      summary: Search QA pairs
      operationId: searchQAPairs
      security:
        - CookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
      responses:
        "200":
          description: Matching QA pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  qa_pairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/QAPair"

  /api/v1/training/categories:
    get:
      tags: [Training]
      summary: List categories
      operationId: listCategories
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags: [Training]
      summary: Create category
      operationId: createCategory
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Pricing
                description:
                  type: string
                color:
                  type: string
                  example: "#3B82F6"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string

  /api/v1/training/categories/{id}:
    delete:
      tags: [Training]
      summary: Delete category and all QA pairs
      operationId: deleteCategory
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/training/categories/{id}/qa:
    get:
      tags: [Training]
      summary: List QA pairs in category
      operationId: listQAPairs
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: QA pairs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  qa_pairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/QAPair"

  /api/v1/training/qa:
    post:
      tags: [Training]
      summary: Create QA pair
      operationId: createQAPair
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, question, answer]
              properties:
                category_id:
                  type: string
                question:
                  type: string
                  example: What is your return policy?
                answer:
                  type: string
                  example: We offer a 30-day money-back guarantee.
      responses:
        "201":
          description: QA pair created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  qa_pair:
                    $ref: "#/components/schemas/QAPair"

  /api/v1/training/qa/{id}:
    put:
      tags: [Training]
      summary: Update QA pair
      operationId: updateQAPair
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QAPairId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, question, answer]
              properties:
                category_id:
                  type: string
                question:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      tags: [Training]
      summary: Delete QA pair
      operationId: deleteQAPair
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QAPairId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/training/bulk-qa:
    post:
      tags: [Training]
      summary: Bulk import QA pairs
      operationId: bulkImportQA
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, qa_pairs]
              properties:
                category_id:
                  type: string
                qa_pairs:
                  type: array
                  items:
                    type: object
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
      responses:
        "200":
          description: Import successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  count:
                    type: integer

  /api/v1/training/unknown-questions:
    get:
      tags: [Training]
      summary: List unknown questions
      operationId: listUnknownQuestions
      security:
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, trained, ignored]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Unknown questions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnknownQuestion"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

