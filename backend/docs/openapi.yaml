openapi: 3.0.3
info:
  title: NOANT Enterprise Platform API
  description: |
    NOANT is an AI-powered customer service platform with multi-channel support
    (WhatsApp, Telegram, Web Widget), inventory management, sales handoffs,
    campaign broadcasting, and analytics.

    ## Authentication
    All authenticated endpoints use **HTTP-only JWT cookies**:
    - `noant_access` — short-lived access token (24h)
    - `noant_refresh` — long-lived refresh token (7d)

    On login/verify, tokens are set as cookies. The `POST /api/v1/auth/refresh`
    endpoint rotates both tokens using the refresh cookie.

    A few endpoints are **public** (no cookies required):
    - Widget public config & chat
    - Payment webhook
    - WhatsApp & Telegram webhooks
    - Payment plan listing
  version: 2.0.0
  contact:
    name: NOANT
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.noant.com
    description: Production

tags:
  - name: Health
    description: Health and readiness probes
  - name: Auth
    description: Registration, login, sessions, password management
  - name: Chats
    description: Conversations, messaging, human takeover
  - name: Training
    description: QA pair and category management, unknown questions
  - name: Analytics
    description: Dashboard metrics, trends, satisfaction
  - name: Integrations
    description: Channel connect / disconnect / test
  - name: Settings
    description: Profile, API keys, team, notifications, account
  - name: Audit
    description: Audit logs
  - name: Notifications
    description: In-app notification inbox
  - name: Widget
    description: Embeddable chat widget config & public chat
  - name: Archive
    description: Conversation archiving and folders
  - name: Payments
    description: Plans, subscriptions, webhooks
  - name: Inventory
    description: Products, services, packages
  - name: Handoffs
    description: AI-to-human sales handoffs
  - name: Credits
    description: AI response credit balance and purchases
  - name: Campaigns
    description: Campaign scheduling
  - name: WhatsApp
    description: OpenWA session management, webhooks, channels
  - name: Templates
    description: WhatsApp message templates
  - name: WhatsApp Admin
    description: Queue stats, session metrics, reconnect
  - name: WhatsApp Interactive
    description: List and button messages
  - name: WhatsApp Media
    description: Upload, list, and retrieve conversation media
  - name: WhatsApp Campaigns
    description: Broadcast campaigns and analytics
  - name: DB Manager
    description: Database cleanup tasks (admin only)
  - name: Background Worker
    description: Background job submission and monitoring (admin only)
  - name: Assistant
    description: Onboarding AI assistant chat
  - name: Onboarding
    description: Onboarding wizard steps and templates
  - name: Push Notifications
    description: Web push subscription management

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: noant_access
      description: |
        JWT access token set as an HTTP-only cookie on login.
        The refresh token cookie `noant_refresh` is also required for
        session rotation via `POST /api/v1/auth/refresh`.

  schemas:
    # ── Common ──────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, error, code, request_id, timestamp, retryable]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "An unexpected error occurred. Please try again later."
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
            - RATE_LIMITED
          example: INTERNAL_ERROR
        request_id:
          type: string
          example: "req_a1b2c3d4"
        timestamp:
          type: string
          format: date-time
        retryable:
          type: boolean

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Operation completed successfully"

    SuccessFlag:
      type: object
      properties:
        success:
          type: boolean
          example: true

    # ── User ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [owner, admin, agent]
        company_name:
          type: string
        phone:
          type: string
        avatar:
          type: string
          nullable: true
        plan_id:
          type: string
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        is_verified:
          type: boolean
        onboarding_status:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TrialInfo:
      type: object
      properties:
        trial_expires_at:
          type: string
          format: date-time
          nullable: true
        trial_ended:
          type: boolean
        trial_days_left:
          type: integer

    # ── Conversation ────────────────────────────────────────
    Conversation:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_email:
          type: string
        customer_avatar:
          type: string
        channel:
          type: string
          enum: [telegram, whatsapp, web, instagram]
        status:
          type: string
          enum: [active, resolved, escalated, archived]
        intent:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        is_ai_transferred:
          type: boolean
        taken_over_by:
          type: string
          nullable: true
        folder_id:
          type: string
          nullable: true
        last_message:
          type: string
        unread:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Message ─────────────────────────────────────────────
    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [ai, human, customer, system]
        content:
          type: string
        is_read:
          type: boolean
        confidence:
          type: number
          format: float
        source:
          type: string
        sequence:
          type: integer
        metadata:
          $ref: "#/components/schemas/MessageMetadata"
        created_at:
          type: string
          format: date-time

    MessageMetadata:
      type: object
      properties:
        confidence:
          type: number
        matched_qa_id:
          type: string
          nullable: true
        escalation_reason:
          type: string
        language:
          type: string
        source:
          type: string

    # ── Training ────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        qa_count:
          type: integer
        created_at:
          type: string
          format: date-time

    QAPair:
      type: object
      properties:
        id:
          type: string
        category_id:
          type: string
        question:
          type: string
        answer:
          type: string
        is_active:
          type: boolean
        usage_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UnknownQuestion:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        conversation_id:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [pending, trained, ignored]
        suggested_answer:
          type: string
          nullable: true
        category_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Integration ─────────────────────────────────────────
    Integration:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
        config:
          type: object
          additionalProperties: true
        webhook_url:
          type: string
        last_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Inventory ───────────────────────────────────────────
    InventoryItem:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        type:
          type: string
          enum: [product, service, package]
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        min_price:
          type: number
          format: double
          nullable: true
        stock_quantity:
          type: integer
          nullable: true
        image_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Handoff ─────────────────────────────────────────────
    Handoff:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        conversation_id:
          type: string
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_whatsapp:
          type: string
        customer_location:
          type: string
        product_name:
          type: string
        original_price:
          type: number
          format: double
        agreed_price:
          type: number
          format: double
        quantity:
          type: integer
        status:
          type: string
          enum: [pending, sold, lost, expired]
        final_price:
          type: number
          format: double
          nullable: true
        owner_notes:
          type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Payment ─────────────────────────────────────────────
    PaymentPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price_ngn:
          type: integer
        ai_responses:
          type: integer
        channels:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        is_popular:
          type: boolean

    # ── Notification ────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        type:
          type: string
        title:
          type: string
        body:
          type: string
        link:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ── Widget ──────────────────────────────────────────────
    WidgetConfig:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        brand_color:
          type: string
        greeting:
          type: string
        bot_name:
          type: string
        position:
          type: string
        widget_api_key:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Archive ─────────────────────────────────────────────
    ArchiveFolder:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        type:
          type: string
        color:
          type: string
        item_count:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── API Key ─────────────────────────────────────────────
    APIKey:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        key:
          type: string
        last_used:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    # ── Team ────────────────────────────────────────────────
    TeamMember:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        joined_at:
          type: string
          format: date-time

    # ── Campaign ────────────────────────────────────────────
    CampaignSchedule:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        status:
          type: string
          enum: [draft, active, completed, canceled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Credits ─────────────────────────────────────────────
    CreditBalance:
      type: object
      properties:
        balance:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_updated:
          type: string
          format: date-time

    CreditPurchase:
      type: object
      properties:
        id:
          type: string
        pack_type:
          type: string
          enum: [small, medium, large]
        amount:
          type: integer
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        purchased_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    PlanLimit:
      type: object
      properties:
        plan_id:
          type: string
        max_responses:
          type: integer
        max_handoffs:
          type: integer
        max_inventory_items:
          type: integer
        has_notification:
          type: boolean
        price_ngn:
          type: integer
        description:
          type: string

    # ── WhatsApp Template ───────────────────────────────────
    WhatsAppTemplate:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        language:
          type: string
        category:
          type: string
          enum: [marketing, utility, authentication]
        status:
          type: string
          enum: [draft, pending, approved, rejected, disabled]
        header_type:
          type: string
          enum: [text, image, video, document, none]
        header_value:
          type: string
        body_text:
          type: string
        footer_text:
          type: string
        buttons:
          type: string
        namespace:
          type: string
        rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateButton:
      type: object
      properties:
        type:
          type: string
          enum: [quick_reply, url, call, catalog]
        text:
          type: string
        url:
          type: string
        phone:
          type: string

    # ── Media ───────────────────────────────────────────────
    MediaMessage:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        session_id:
          type: string
        media_type:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        file_name:
          type: string
        caption:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Analytics ───────────────────────────────────────────
    AnalyticsOverview:
      type: object
      properties:
        total_conversations:
          type: integer
        conversations_today:
          type: integer
        active_conversations:
          type: integer
        unread_conversations:
          type: integer
        resolved_today:
          type: integer
        ai_resolution_rate:
          type: number
        avg_response_time:
          type: number
        customer_satisfaction:
          type: number
        total_messages:
          type: integer
        escalated_count:
          type: integer
        billing_alert:
          type: boolean

    # ── DB Manager ──────────────────────────────────────────
    CleanupReport:
      type: object
      properties:
        tasks_run:
          type: integer
        total_deleted:
          type: integer
        has_errors:
          type: boolean
        results:
          type: array
          items:
            type: object

    # ── Background Worker ───────────────────────────────────
    BackgroundTask:
      type: object
      properties:
        id:
          type: string
        task_name:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        payload:
          type: object
        result:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── OpenAI Assistant ────────────────────────────────────
    AssistantResponse:
      type: object
      properties:
        content:
          type: string
        action:
          type: string
        steps:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string

    # ── Onboarding ──────────────────────────────────────────
    OnboardingStatus:
      type: object
      properties:
        completed_steps:
          type: array
          items:
            type: string
        current_step:
          type: string
        is_complete:
          type: boolean

    IndustryTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        categories:
          type: array
          items:
            type: string

    # ── Push Subscription ───────────────────────────────────
    PushSubscriptionRequest:
      type: object
      required: [endpoint, auth, p256dh]
      properties:
        endpoint:
          type: string
          format: uri
        auth:
          type: string
        p256dh:
          type: string

    # ── Settings ────────────────────────────────────────────
    NotifPrefs:
      type: object
      properties:
        email_notifications:
          type: boolean
        push_notifications:
          type: boolean
        handoff_alerts:
          type: boolean
        weekly_report:
          type: boolean

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Conversation ID

    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Category ID

    QAPairId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: QA pair ID

    UnknownQuestionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Unknown question ID

    ChannelName:
      name: channel
      in: path
      required: true
      schema:
        type: string
        enum: [telegram, whatsapp, facebook, instagram]
      description: Channel name

    APIKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: API key ID

    TeamMemberId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Team member ID

    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Notification ID

    ArchiveFolderId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Archive folder ID

    InventoryItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Inventory item ID

    HandoffId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Handoff ID

    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Campaign ID

    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp template ID

    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp session ID

    SessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp session ID

    MediaId:
      name: mediaID
      in: path
      required: true
      schema:
        type: string
      description: Media file ID

    BackgroundTaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Background task ID

    CampaignIdPath:
      name: campaignID
      in: path
      required: true
      schema:
        type: string
      description: Campaign ID

# ════════════════════════════════════════════════════════════
#  PATHS
# ════════════════════════════════════════════════════════════
paths:

  # ── Health ────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns health status of API, database, Redis, and Groq.
      operationId: healthCheck
      responses:
        "200":
          description: All critical services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        "503":
          description: Critical service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  checks:
                    type: object

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  checks:
                    type: object

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Admin-only Prometheus metrics endpoint.
      operationId: metrics
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ── WebSocket ─────────────────────────────────────────────
  /ws:
    get:
      tags: [Chats]
      summary: WebSocket connection
      description: |
        Real-time WebSocket connection for conversation updates.
        Secured with JWT auth (from cookie) and origin validation.
        Messages arrive as JSON: `{ type: "new_message"|"typing_indicator"|"integration_update", conversation_id, data }`.
      operationId: websocketConnect
      security:
        - CookieAuth: []
      responses:
        "101":
          description: WebSocket upgrade successful
        "401":
          description: Invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════
  #  AUTH
  # ══════════════════════════════════════════════════════════
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123!
                first_name:
                  type: string
                  example: Jane
                last_name:
                  type: string
                  example: Doe
                company_name:
                  type: string
                  example: Acme Corp
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful (sets noant_access + noant_refresh cookies)
          headers:
            Set-Cookie:
              description: JWT cookies set automatically
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  trial_info:
                    $ref: "#/components/schemas/TrialInfo"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: email_not_verified
        "429":
          description: Account temporarily locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      description: Blacklists the current access token and clears auth cookies.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Email verified (sets auth cookies)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
                  trial_info:
                    $ref: "#/components/schemas/TrialInfo"
        "400":
          description: Invalid verification code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_code
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: too_many_attempts

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification code
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session tokens
      description: |
        Reads the `noant_refresh` cookie, validates it, and issues new
        access + refresh tokens (rotation). Sets updated cookies.
      operationId: refreshToken
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      operationId: getMe
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  trial_info:
                    $ref: "#/components/schemas/TrialInfo"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change password
      operationId: changePassword
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Always returns success (does not reveal if email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If the email exists, a reset link has been sent

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  description: Password reset token from email link
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ══════════════════════════════════════════════════════════
  #  CHATS
  # ══════════════════════════════════════════════════════════
  /api/v1/chats/direct-chat:
    post:
      tags: [Chats]
      summary: Start direct chat
      description: Create or resume a conversation and send the first message.
      operationId: directChat
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, channel]
              properties:
                customer_name:
                  type: string
                message:
                  type: string
                channel:
                  type: string
                  enum: [web, telegram, whatsapp, instagram, facebook]
      responses:
        "200":
          description: Conversation created / message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                  message:
                    $ref: "#/components/schemas/Message"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/conversations:
    get:
      tags: [Chats]
      summary: List conversations
      operationId: listConversations
      security:
        - CookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, resolved, escalated, archived]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Paginated conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  has_more:
                    type: boolean

  /api/v1/chats/conversations/{id}:
    get:
      tags: [Chats]
      summary: Get conversation with messages
      operationId: getConversation
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        "200":
          description: Conversation detail with paginated messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  total:
                    type: integer
                  has_more:
                    type: boolean
                  page:
                    type: integer
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/conversations/{id}/messages:
    post:
      tags: [Chats]
      summary: Send message in conversation
      description: |
        Sends a customer message and triggers an async AI response.
        AI reply is delivered over WebSocket, not in the HTTP response.
      operationId: sendMessage
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Message queued (AI response sent via WebSocket)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Message sent
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/conversations/{id}/takeover:
    put:
      tags: [Chats]
      summary: Human agent takeover
      operationId: humanTakeover
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation taken over
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/conversations/{id}/escalate:
    post:
      tags: [Chats]
      summary: Escalate conversation
      operationId: escalateConversation
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Conversation escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/chats/conversations/{id}/rate:
    post:
      tags: [Chats]
      summary: Rate a conversation
      operationId: rateConversation
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
                feedback:
                  type: string
      responses:
        "200":
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Score must be 1-5
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chats/clear:
    delete:
      tags: [Chats]
      summary: Clear all chats
      operationId: clearChats
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Chats cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

